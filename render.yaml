services:
  - type: web
    name: freelance-hunter-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: TARGET_CHATS
        sync: false
      - key: PORT
        value: 10000
